version: '3.8'

networks:
  crossbridge-fabric:
    name: crossbridge-fabric

services:
  ca.crossbridge.net:
    image: hyperledger/fabric-ca:1.5.7
    container_name: ca.crossbridge.net
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.crossbridge.net
      - FABRIC_CA_SERVER_TLS_ENABLED=false
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./fabric-ca:/etc/hyperledger/fabric-ca-server
    networks:
      - crossbridge-fabric

  orderer.crossbridge.net:
    image: hyperledger/fabric-orderer:2.5.6
    container_name: orderer.crossbridge.net
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
    ports:
      - "7050:7050"
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./crypto-config/ordererOrganizations/crossbridge.net/orderers/orderer.crossbridge.net/msp:/var/hyperledger/orderer/msp
    networks:
      - crossbridge-fabric

  peer0.org1.crossbridge.net:
    image: hyperledger/fabric-peer:2.5.6
    container_name: peer0.org1.crossbridge.net
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=crossbridge-fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_ID=peer0.org1.crossbridge.net
      - CORE_PEER_ADDRESS=peer0.org1.crossbridge.net:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.crossbridge.net:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.crossbridge.net:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.crossbridge.net:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    ports:
      - "7051:7051"
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/org1.crossbridge.net/peers/peer0.org1.crossbridge.net/msp:/etc/hyperledger/fabric/msp
    networks:
      - crossbridge-fabric

  peer0.org2.crossbridge.net:
    image: hyperledger/fabric-peer:2.5.6
    container_name: peer0.org2.crossbridge.net
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=crossbridge-fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_ID=peer0.org2.crossbridge.net
      - CORE_PEER_ADDRESS=peer0.org2.crossbridge.net:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.crossbridge.net:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.crossbridge.net:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.crossbridge.net:8051
      - CORE_PEER_LOCALMSPID=Org2MSP
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    ports:
      - "8051:8051"
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/org2.crossbridge.net/peers/peer0.org2.crossbridge.net/msp:/etc/hyperledger/fabric/msp
    networks:
      - crossbridge-fabric

  peer0.org3.crossbridge.net:
    image: hyperledger/fabric-peer:2.5.6
    container_name: peer0.org3.crossbridge.net
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=crossbridge-fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_ID=peer0.org3.crossbridge.net
      - CORE_PEER_ADDRESS=peer0.org3.crossbridge.net:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org3.crossbridge.net:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org3.crossbridge.net:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org3.crossbridge.net:9051
      - CORE_PEER_LOCALMSPID=Org3MSP
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    ports:
      - "9051:9051"
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/org3.crossbridge.net/peers/peer0.org3.crossbridge.net/msp:/etc/hyperledger/fabric/msp
    networks:
      - crossbridge-fabric
